<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#e6cfa5"/>
      <stop offset="100%" stop-color="#b89a6e"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.18 0" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="none" stroke="#2b1a0e" stroke-width="1.2"/>
  <text x="50" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="900" text-anchor="middle" fill="#2b1a0e" filter="url(#rough)">?</text>
</svg>
